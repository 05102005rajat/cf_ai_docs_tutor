<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudflare Docs Tutor</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --text: #e6e6e6;
        --muted: #9aa3b2;
        --accent: #f6821f;
        --user: #1f2937;
        --assistant: #111827;
        --border: #262a33;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
      header .sub { color: var(--muted); font-size: 13px; margin-left: auto; }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
      }
      .msg {
        padding: 12px 14px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
        border: 1px solid var(--border);
      }
      .msg.user { background: var(--user); align-self: flex-end; max-width: 80%; }
      .msg.assistant { background: var(--assistant); align-self: flex-start; max-width: 90%; }
      .msg.system { background: transparent; color: var(--muted); font-size: 13px; text-align: center; border: none; }
      form {
        display: flex;
        gap: 8px;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
      }
      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        padding: 0 18px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #111;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: wait; }
      code, pre {
        background: #0b0d12;
        padding: 2px 5px;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1>Cloudflare Docs Tutor</h1>
      <span class="sub">RAG over developers.cloudflare.com · Workers AI · Vectorize · Durable Objects</span>
    </header>
    <div id="messages">
      <div class="msg system">Ask me anything about Cloudflare Agents, Workers AI, Vectorize, Durable Objects, or Workflows.</div>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="How do I build an agent with tools?" />
      <button id="send" type="submit">Send</button>
    </form>
    <script src="/app.js"></script>
  </body>
</html>
